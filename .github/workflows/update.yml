name: hourly-update
on:
  schedule:
    # 臺北 07:00 → 隔天 01:00 (UTC 23:00 → 17:00), 每小時一次
    - cron: "0 23-23,0-17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Scrape
        run: bun run scripts/scrape.ts

      - name: Commit data if changed
        run: |
          git config user.name "ironman-bot"
          git config user.email "ironman-bot@users.noreply.github.com"
          git add data/ web/public/data/
          if git diff --cached --quiet; then
            echo "no data change; skipping commit+build+deploy"
            exit 0
          fi
          git commit -m "chore: update ironman data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Build site
        run: cd web && bun install && bun run build

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create ironman-observer-next --production-branch=main \
            || echo "project already exists (or create failed — deploy will confirm)"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy web/dist --project-name=ironman-observer-next
