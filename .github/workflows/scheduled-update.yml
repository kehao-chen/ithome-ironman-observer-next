name: scheduled-update
on:
  # No `schedule`: the Cloudflare Worker `ironman-observer-trigger` fires this
  # workflow via `workflow_dispatch` every 15 min (GitHub's `schedule` trigger
  # is delayed/dropped at the top of every hour).
  workflow_dispatch: {}

# Serialize runs across all update workflows (scheduled & deep-calibrate):
concurrency:
  group: data-update-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Bounded so a hung scrape cannot hold the `data-update-main` concurrency
    # group for GitHub's 6h default and stall every later run behind it.
    timeout-minutes: 20
    steps:
      # Full history so `git pull --rebase` can always find a merge base.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Scrape (Incremental)
        run: bun run scripts/scrape.ts

      - name: Commit data if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no data change; skipping commit+build+deploy"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore: update ironman data $(date -u +%Y-%m-%dT%H:%MZ)"

          # Rebase onto the latest main before pushing: if a feature commit or
          # another scraper run landed while we were scraping, the bot commit is
          # replayed on top with `-X theirs` (newly scraped data takes precedence on JSON conflicts).
          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "push failed after rebase retries" >&2
          exit 1

      - name: Build site
        if: steps.commit.outputs.changed == 'true'
        run: cd web && bun install --frozen-lockfile && bun run build

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy web/dist --project-name=ironman-observer-next
