name: scheduled-update
on:
  # No `schedule`: the Cloudflare Worker `ironman-observer-trigger` fires this
  # workflow via `workflow_dispatch` every 10 min (GitHub's `schedule` trigger
  # is delayed/dropped at the top of every hour).
  workflow_dispatch: {}

# Serialize runs: the trigger fires every 10 min, so a slow run must not race
# the next one for the same branch.
concurrency:
  group: scheduled-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Full history so `git pull --rebase` can always find a merge base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Scrape
        run: bun run scripts/scrape.ts

      - name: Commit data if changed
        run: |
          git config user.name "ironman-bot"
          git config user.email "ironman-bot@users.noreply.github.com"
          git add data/ web/public/data/
          if git diff --cached --quiet; then
            echo "no data change; skipping commit+build+deploy"
            exit 0
          fi
          git commit -m "chore: update ironman data $(date -u +%Y-%m-%dT%H:%MZ)"

          # Rebase onto the latest main before pushing: if a feature commit
          # landed while we were scraping, the bot commit is replayed on top
          # of it instead of failing the push.
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              git push origin main && exit 0
            fi
            sleep 5
          done
          echo "push failed after rebase retries" >&2
          exit 1

      - name: Build site
        run: cd web && bun install && bun run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy web/dist --project-name=ironman-observer-next
