name: deep-calibrate
on:
  schedule:
    - cron: "15 */2 * * *"
    # 15:50 UTC = 23:50 Asia/Taipei — the last full scrape of the Taipei day, so
    # its snapshot is that day's final state. Only this run passes --history.
    - cron: "50 15 * * *"
  workflow_dispatch:
    inputs:
      history:
        description: "Also write a data/history/<year>/<date>.json snapshot"
        type: boolean
        default: false

concurrency:
  group: data-update-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    # A full calibration is slower than the incremental run but still ~5 min;
    # bounded so a hung fetch cannot hold the shared concurrency group for 6h.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Scrape (Full Calibration)
        # Snapshots are a once-a-day archive: writing one on every run re-committed
        # the same 1.9MB file ~96x/day. Only the 23:50 Taipei cron (or an explicit
        # manual request) takes one.
        env:
          HISTORY_FLAG: ${{ (github.event.schedule == '50 15 * * *' || inputs.history) && '--history' || '' }}
        run: bun run scripts/scrape.ts --full $HISTORY_FLAG

      - name: Commit data if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no data change; skipping commit+build+deploy"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore: deep calibrate ironman data $(date -u +%Y-%m-%dT%H:%MZ)"

          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "push failed after rebase retries" >&2
          exit 1

      - name: Build site
        if: steps.commit.outputs.changed == 'true'
        run: cd web && bun install --frozen-lockfile && bun run build

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy web/dist --project-name=ironman-observer-next
